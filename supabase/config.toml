# Cron calls authenticate using the service-role key or the default secret API
# key in `apikey`. User initiated billing calls validate their session
# inside the handler before any privileged database operation.
[functions.faturamento-cobrancas]
verify_jwt = false

[functions.enviar-lembretes-cobranca]
verify_jwt = false

[functions.zernio-message-scheduler]
verify_jwt = false
